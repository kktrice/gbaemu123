<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GBA Emulator</title>
  <style>
    body {
      background: black;
      color: white;
      text-align: center;
      font-family: sans-serif;
    }
    #game-container {
      width: 640px;
      height: 480px;
      margin: 20px auto;
    }
    #game-container canvas {
      width: 100% !important;
      height: 100% !important;
      image-rendering: pixelated;
      background: black;
    }
    input[type="file"] {
      margin-top: 20px;
      color: white;
    }
  </style>
</head>

<body>

<h2>Upload Your GBA ROM</h2>
<input type="file" id="romInput" accept=".gba">

<div id="game-container"></div>

<!-- EmulatorJS loader -->
<script src="https://www.emulatorjs.com/loader.js"></script>

<script>
const romInput = document.getElementById("romInput");
romInput.addEventListener("change", function() {
  const file = romInput.files[0];
  if (!file) return;

  // Read the ROM as ArrayBuffer (better for HTTPS / GitHub Pages)
  const reader = new FileReader();
  reader.onload = function() {
    const arrayBuffer = reader.result;

    // Create a Blob URL that the emulator can fetch
    const blob = new Blob([arrayBuffer], { type: "application/octet-stream" });
    const blobURL = URL.createObjectURL(blob);

    // Set up EmulatorJS
    EJS_player = "#game-container";
    EJS_core = "gba";
    EJS_gameUrl = blobURL;

    if (typeof EJS_start === "function") {
      EJS_start();
    }
  };
  reader.readAsArrayBuffer(file);
});
</script>

</body>
</html>
